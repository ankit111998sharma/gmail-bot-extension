[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-bot-extension"
version = "0.1.0"
description = "Portable Gmail AI draft assistant. Drafts only — never sends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.140.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth-httplib2>=0.2.0",
  "streamlit>=1.36.0",
  "beautifulsoup4>=4.12.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
build = ["pyinstaller>=6.0.0"]

[project.scripts]
gmail-bot = "gmail_bot.cli:main"

[tool.setuptools.packages.find]
include = ["gmail_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
